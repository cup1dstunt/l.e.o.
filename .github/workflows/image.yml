# Baut bei jedem Push auf main das Docker-Image des Prototyps und legt es in der GitHub Container Registry ab.
# Unraid holt es dann als fertiges Image: ghcr.io/cup1dstunt/leo-prototyp:latest
name: Image bauen

on:
  push:
    branches: [main]
    paths: ['app/**', 'design/**', 'docs/testfaelle/**', '.github/workflows/image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: |
            ghcr.io/cup1dstunt/leo-prototyp:latest
            ghcr.io/cup1dstunt/leo-prototyp:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/cup1dstunt/l.e.o.
          cache-from: type=gha
          cache-to: type=gha,mode=max
